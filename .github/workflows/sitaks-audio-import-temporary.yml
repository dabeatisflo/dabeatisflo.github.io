name: SITAKS temporary audio import
on:
  push:
    paths:
      - '.github/workflows/sitaks-audio-import-temporary.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'dabeatisflo/dabeatisflo.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate SITAKS test jingle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sitaks/audio-test
          curl --fail --location --retry 3 --retry-delay 2 --max-time 120 'https://at.adobe.com/V80ce8QJRARm0Afj' -o 'sitaks/audio-test/christmas1M.mp3'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 'sitaks/audio-test/christmas1M.mp3' | grep -E '^codec_name=mp3$'
          test "$(wc -c < 'sitaks/audio-test/christmas1M.mp3')" -gt 100000
      - name: Commit the verified audio to only SITAKS folder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sitaks/audio-test/christmas1M.mp3
          git diff --cached --quiet || (git commit -m 'Add SITAKS first public test jingle' && git push)
