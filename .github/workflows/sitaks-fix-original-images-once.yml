name: SITAKS import original approved PNG images
on:
  push:
    paths:
      - '.github/workflows/sitaks-fix-original-images-once.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'dabeatisflo/dabeatisflo.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original approved SITAKS artwork, check hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sitaks/assets
          curl -fL --retry 3 --retry-delay 3 --max-time 180 'https://at.adobe.com/5a3syPxeie9xz8TD' -o 'sitaks/assets/sitaks-studio-approved-20261016.png'
          echo '5f0190aca48c9a266efc2d29c1c2bb24ba6e31461e4183ba8bb37f195c7b6491  sitaks/assets/sitaks-studio-approved-20261016.png' | sha256sum -c -
          curl -fL --retry 3 --retry-delay 3 --max-time 180 'https://at.adobe.com/VVoFI4H8J8ExHj6a' -o 'sitaks/assets/sitaks-missie-visie-approved-20261016.png'
          echo '22879cf025f5f77af59bcd047bb967e276382112967bf3b6ee9efe3cc17731b9  sitaks/assets/sitaks-missie-visie-approved-20261016.png' | sha256sum -c -
      - name: Add original images to the SITAKS directory only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sitaks/assets/sitaks-studio-approved-20261016.png sitaks/assets/sitaks-missie-visie-approved-20261016.png
          git diff --cached --quiet || (git commit -m 'Add full resolution approved studio and mission artwork' && git push origin HEAD:main)
