name: SITAKS import original full-width design PNG
on:
  push:
    paths:
      - '.github/workflows/sitaks-design-image-once.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'dabeatisflo/dabeatisflo.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original approved full resolution design artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sitaks/assets
          curl -fL --retry 3 --retry-delay 3 --max-time 180 'https://at.adobe.com/2pCjZtLzQbZjuNZX' -o 'sitaks/assets/sitaks-grafisch-origineel-20261016.png'
          echo 'f1c831d235efc5ce43682eb8c4c287d1f4c210d63a3b2ac74555f77eac5ce677  sitaks/assets/sitaks-grafisch-origineel-20261016.png' | sha256sum -c -
      - name: Commit original image, SITAKS only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sitaks/assets/sitaks-grafisch-origineel-20261016.png
          git diff --cached --quiet || (git commit -m 'Save original full-width SITAKS graphical design image losslessly' && git push origin HEAD:main)
